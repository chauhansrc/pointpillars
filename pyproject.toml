[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pointpillars"
version = "0.1.0"
description = "PointPillars (Lang et al., CVPR 2019) in pure PyTorch - no spconv, no CUDA extensions"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["torch>=2.1", "numpy>=1.23", "shapely>=2.0", "pyyaml>=6.0", "matplotlib>=3.6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["pointpillars*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
